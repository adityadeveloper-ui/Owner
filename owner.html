<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>EXP OWNER PANEL</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#050b16; --card:#070e1b; --field:#0d1522; --field-deep:#02060d;
  --line:#2c3748; --cyan:#00b8f0; --text:#e8eef6; --muted:#8793a5;
  --grad:linear-gradient(90deg,#0090f0,#00e5ff); --danger:#ff5d6c; --ok:#2ee59d; --row:#111a2b;
  --btn-ink:#fff;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#eef3f9; --card:#fff; --field:#f1f5fa; --field-deep:#fff; --line:#b3c0d2; --cyan:#0079c9;
    --text:#0d1726; --muted:#5b6778; --row:#e4ebf4; --btn-ink:#00121f;
  }
}
:root[data-theme="light"]{
  --bg:#eef3f9; --card:#fff; --field:#f1f5fa; --field-deep:#fff; --line:#b3c0d2; --cyan:#0079c9;
  --text:#0d1726; --muted:#5b6778; --row:#e4ebf4; --btn-ink:#00121f;
}
:root[data-theme="dark"]{
  --bg:#050b16; --card:#070e1b; --field:#0d1522; --field-deep:#02060d; --line:#2c3748; --cyan:#00b8f0;
  --text:#e8eef6; --muted:#8793a5; --row:#111a2b; --btn-ink:#fff;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;font-size:17px;line-height:1.4}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.wrap{max-width:520px;margin:0 auto;padding:28px 16px 40px}
.wrap.wide{max-width:760px}
.disp{font-family:Orbitron,Roboto,sans-serif;font-weight:900;letter-spacing:.14em;text-transform:uppercase}

/* panel header */
.head{display:grid;grid-template-columns:1fr auto;gap:14px 12px;font-size:14px}
.head .r{text-align:right}
.rule{height:2px;background:var(--cyan);opacity:.9;margin:22px 0}
.rule.tall{margin:40px 0 22px}

.dash{border:2px dashed var(--line);border-radius:16px;padding:18px;background:transparent;margin-bottom:18px}
.dash .lbl{display:block;font-size:17px;margin:0 0 10px;color:var(--text)}
.in{display:block;width:100%;background:var(--field);border:1px solid transparent;border-radius:14px;height:60px;padding:0 18px;font-size:19px;margin-bottom:20px}
.in:focus{border-color:var(--cyan);outline:0}
.in.deep{background:var(--field-deep);border-color:var(--line)}
.search{display:flex;align-items:center;gap:10px;background:var(--field-deep);border:1px solid var(--line);border-radius:14px;padding:0 16px;height:58px;margin-bottom:16px}
.search input{flex:1;min-width:0;background:none;border:0;outline:0;font-size:19px}
.search input::placeholder,.in::placeholder{color:var(--muted)}
.sel{position:relative;margin-bottom:16px}
.sel select{appearance:none;-webkit-appearance:none;width:100%;height:62px;background:var(--field);border:1px solid var(--line);border-radius:14px;padding:0 50px 0 22px;font-size:21px;cursor:pointer}
.sel::after{content:"";position:absolute;right:22px;top:50%;width:8px;height:8px;border-right:2px solid var(--text);border-bottom:2px solid var(--text);transform:translateY(-70%) rotate(45deg);pointer-events:none}
.btn{display:block;width:100%;height:58px;border:0;border-radius:16px;background:var(--grad);color:var(--btn-ink);font-weight:700;font-size:18px;cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.985)}
.btn.big{height:64px;border-radius:20px;font-size:19px}
.btn.dark{background:#000;color:#fff;height:58px;border-radius:0;margin-top:14px}
.btn.ghost{background:var(--field);color:var(--text);border:1px solid var(--line);font-weight:500}
.btn.sm{height:44px;font-size:15px;border-radius:12px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--danger)}
.fold{display:flex;align-items:center;justify-content:space-between;width:100%;background:var(--row);border:0;border-radius:10px;padding:18px 20px;font-size:21px;cursor:pointer;text-align:left}
.fold span.ar{font-size:15px;transition:transform .15s}
.fold[aria-expanded="true"] span.ar{transform:rotate(90deg)}
.fold-body{display:none;padding:16px 4px 0}
.fold-body.open{display:block}
.note{color:var(--muted);font-size:14px;margin:-8px 0 14px}
.live{color:var(--muted);font-size:14px;margin-top:12px}
.live b{color:var(--text);font-weight:500}
.err{color:var(--danger);font-size:15px;margin:-6px 0 14px;min-height:1px}
.demo-link{display:block;text-align:center;color:var(--muted);font-size:13px;margin-top:22px;text-decoration:underline;cursor:pointer;background:none;border:0;width:100%}

/* owner site */
.title{font-size:22px;margin:0}
.sub{color:var(--muted);font-size:14px;margin:6px 0 18px}
.card-h{font-size:19px;margin:0 0 4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:120px}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:-8px 0 16px}
.chip{border:1px solid var(--line);background:var(--field);border-radius:999px;padding:8px 14px;font-size:14px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan) inset}
.in.s{height:50px;font-size:16px;margin-bottom:12px}
.item{padding:14px 0;border-bottom:1px solid var(--line)}
.item:last-child{border-bottom:0}
.item .nm{font-weight:500;word-break:break-word}
.item .meta{color:var(--muted);font-size:13px;margin-top:2px;word-break:break-word}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.mini{background:var(--field);border:1px solid var(--line);border-radius:10px;padding:8px 12px;font-size:14px;cursor:pointer}
.mini.del{color:var(--danger)}
.badge{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:1px 8px;margin-left:6px;color:var(--muted)}
.badge.ok{color:var(--ok);border-color:var(--ok)}
.badge.bad{color:var(--danger);border-color:var(--danger)}
.cred{background:var(--field);border:1px solid var(--cyan);border-radius:14px;padding:14px;margin-top:6px;font-size:15px;white-space:pre-wrap;word-break:break-all}
.empty{color:var(--muted);text-align:center;padding:16px 0;font-size:14px}
.staged{background:var(--field);border-radius:12px;padding:12px;margin-bottom:10px}
.staged small{color:var(--muted);display:block;margin-bottom:8px;word-break:break-all}
dialog{width:min(560px,94vw);max-height:90vh;background:var(--bg);color:var(--text);border:1px solid var(--line);border-radius:16px;padding:18px}
dialog::backdrop{background:rgba(0,0,0,.65)}
dialog iframe{width:100%;height:60vh;border:1px solid var(--line);border-radius:10px;background:#fff}
.link-row{display:flex;align-items:center;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}
.link-row .u{flex:1;min-width:0;word-break:break-all;font-size:15px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);background:var(--card);border:1px solid var(--cyan);padding:12px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:.25s;z-index:99;max-width:90vw;font-size:15px}
.toast.show{opacity:1;transform:translate(-50%,0)}
.site-frame{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
.site-msg{min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div id="app"></div>
<dialog id="dlg"></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
(function(){
var K="exp-web-panel-v2", mem=null;
var $=function(s,r){return (r||document).querySelector(s)};
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)}
function rnd(n,set){var o="";for(var i=0;i<n;i++)o+=set.charAt(Math.floor(Math.random()*set.length));return o}
var SAMPLE='<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font-family:system-ui,sans-serif;background:#0b1626;color:#fff;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;padding:24px}h1{margin:0 0 10px}p{opacity:.8}</style></head><body><div><h1>Sample page</h1><p>UPI: {{UPI}}<br>Reference: {{TR}}</p></div></body></html>';

function load(){
  try{var r=localStorage.getItem(K);if(r){var d=JSON.parse(r);if(d&&d.scripts)return d}}catch(e){}
  return mem||{owner:null,domain:"",scripts:[],clients:[]};
}
var REMOTE="https://wizard-web-fadd8-default-rtdb.firebaseio.com";
var BASE=REMOTE.replace(/\/+$/,"")+"/panel";
function ck(id){return String(id).trim().toLowerCase().replace(/[^a-z0-9@_-]/g,function(c){return "_"+c.charCodeAt(0).toString(16)+"_"})}
function arr(o){return !o?[]:Array.isArray(o)?o.filter(Boolean):Object.keys(o).map(function(k){return o[k]})}
function needSetup(){return /PASTE_FIREBASE_URL_HERE/.test(REMOTE)}
var db=load(),known={},synced=false,wseq=0,pend=0;
function rq(m,path,body){pend++;return fetch(BASE+path+".json",{method:m,body:body===undefined?undefined:JSON.stringify(body)}).then(function(r){if(!r.ok)throw 0}).catch(function(){toast("Could not save to server")}).then(function(){pend--})}
function cache(){mem=db;try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}}
function save(){
  cache();if(!synced)return;wseq++;
  rq("PATCH","",{owner:db.owner,domain:db.domain||""});
  var sc={};db.scripts.forEach(function(x){sc[x.id]=x});rq("PUT","/scripts",sc);
  db.clients.forEach(function(c){var k=ck(c.id);
    if(known[k])rq("PATCH","/clients/"+k,{active:c.active,expiresAt:c.expiresAt,createdAt:c.createdAt});
    else{known[k]=1;rq("PUT","/clients/"+k,c)}
  });
}
function pull(cb){
  fetch(BASE+".json").then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(d){
    var raw=d||{};
    cb({owner:raw.owner||null,domain:raw.domain||"",scripts:arr(raw.scripts),clients:arr(raw.clients).map(function(c){c.links=arr(c.links);return c})},Object.keys(raw.clients||{}));
  }).catch(function(){cb(null)});
}
function refresh(){
  if(!synced)return;var s0=wseq;
  pull(function(nd,keys){
    if(!nd||pend>0||s0!==wseq)return;
    db=nd;known={};keys.forEach(function(k){known[k]=1});cache();
    var a=document.activeElement,typing=a&&(a.tagName==="INPUT"||a.tagName==="TEXTAREA");
    if(ownerOK&&!$("#dlg").open&&!typing&&!staged.length)renderOwner();
  });
}
setInterval(refresh,6000);
document.addEventListener("visibilitychange",function(){if(!document.hidden)refresh()});
var ownerOK=false;
var CLIENT_URL="client.html";

function toast(m){var t=$("#toast");t.textContent=m;t.classList.add("show");clearTimeout(toast._t);toast._t=setTimeout(function(){t.classList.remove("show")},2200)}
function copy(text){
  try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(text).then(function(){toast("Copied")},function(){fb()});return}}catch(e){}
  fb();
  function fb(){var a=document.createElement("textarea");a.value=text;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();var ok=false;try{ok=document.execCommand("copy")}catch(e){}a.remove();toast(ok?"Copied":"Press and hold to copy it manually")}
}
function daysLeft(c){return Math.ceil((c.expiresAt-Date.now())/86400000)}
function status(c){if(!c.active)return "disabled";if(c.expiresAt<=Date.now())return "expired";return "live"}
function scriptById(id){return db.scripts.filter(function(s){return s.id===id})[0]}
function clientByLogin(id){return db.clients.filter(function(c){return c.id.toLowerCase()===String(id).trim().toLowerCase()})[0]}
function clientBySlug(slug){return db.clients.filter(function(c){return c.links.indexOf(slug)>-1})[0]}
function slugTaken(slug){return db.clients.some(function(c){return c.links.indexOf(slug)>-1})}
function cleanSlug(s){return String(s).toLowerCase().replace(/[^a-z0-9-]/g,"").slice(0,30)}
function siteBase(){var d=String(db.domain||"").trim().replace(/^https?:\/\//i,"").replace(/\/+$/,"");return d?"https://"+d:location.origin}
function fullUrl(slug){return siteBase()+"/#"+slug}
function dlg(html){var d=$("#dlg");d.innerHTML=html;if(!d.open)d.showModal();return d}
function closeDlg(){var d=$("#dlg");if(d.open)d.close()}

/* ---------- router ---------- */
function route(){document.body.style.background="";renderOwner()}
function go(h){window.open(CLIENT_URL+h,"_blank")}

/* ---------- owner site ---------- */
var staged=[], validity=0, lastCred=null, lastSlug=null;
function renderOwner(){
  var app=$("#app");
  if(!db.owner){
    app.innerHTML='<div class="wrap"><div class="disp" style="font-size:18px">Owner site</div><div class="rule"></div>'+
    '<div class="dash"><label class="lbl" for="op">Create your owner passcode</label><input class="in" id="op" type="password" placeholder="At least 6 characters">'+
    '<div class="err" id="oe"></div><button class="btn" id="ob">Set passcode</button></div></div>';
    $("#ob").onclick=function(){var v=$("#op").value;if(v.length<6){$("#oe").textContent="Use at least 6 characters";return}db.owner=v;save();ownerOK=true;renderOwner()};
    return;
  }
  if(!ownerOK){
    app.innerHTML='<div class="wrap"><div class="disp" style="font-size:18px">Owner site</div><div class="rule"></div>'+
    '<div class="dash"><label class="lbl" for="op">Owner passcode</label><input class="in" id="op" type="password">'+
    '<div class="err" id="oe"></div><button class="btn" id="ob">Enter</button></div></div>';
    var t=function(){if($("#op").value===db.owner){ownerOK=true;renderOwner()}else $("#oe").textContent="Wrong passcode"};
    $("#ob").onclick=t;$("#op").onkeydown=function(e){if(e.key==="Enter")t()};
    return;
  }
  var h='<div class="wrap wide">'+
   '<div class="head disp" style="grid-template-columns:1fr auto"><div>Owner site</div><div class="r"><span style="cursor:pointer;text-decoration:underline" id="lo">Lock</span></div></div><div class="rule"></div>';

  // upload
  h+='<div class="dash"><h2 class="card-h">Upload HTML files</h2><p class="sub">Choose one or many files, name each one, then save. Saved names appear in every client panel. Use <b>{{UPI}}</b> and <b>{{TR}}</b> inside your HTML to insert the client\'s values.</p>'+
     '<input type="file" id="files" accept=".html,.htm,text/html" multiple hidden>'+
     '<button class="btn ghost" id="pickFiles">Choose HTML files</button><div style="height:14px"></div><div id="stagedBox"></div></div>';

  // library
  h+='<div class="dash"><h2 class="card-h">Scripts ('+db.scripts.length+')</h2><p class="sub">Names clients can pick from.</p>';
  if(!db.scripts.length)h+='<div class="empty">No scripts yet. Upload an HTML file above.</div>';
  db.scripts.forEach(function(s){
    var n=db.clients.filter(function(c){return c.scriptId===s.id}).length;
    h+='<div class="item"><div class="nm">'+esc(s.name)+'<span class="badge">'+Math.max(1,Math.round(s.html.length/1024))+' KB</span>'+(n?'<span class="badge ok">'+n+' live</span>':'')+'</div>'+
       '<div class="acts"><button class="mini" data-pv="'+s.id+'">Preview</button><button class="mini" data-rn="'+s.id+'">Rename</button><button class="mini" data-rp="'+s.id+'">Replace file</button><button class="mini del" data-dl="'+s.id+'">Delete</button></div></div>';
  });
  h+='<input type="file" id="repFile" accept=".html,.htm,text/html" hidden></div>';

  // create client
  h+='<div class="dash"><h2 class="card-h">Create client login</h2><p class="sub">Make an ID and password that works for the days you choose.</p>'+
     '<label class="lbl" for="cid">User ID</label><input class="in s" id="cid" placeholder="Enter user ID" autocapitalize="off">'+
     '<label class="lbl" for="cpw">Password</label><div class="row" style="margin-bottom:12px"><input class="in s" id="cpw" placeholder="Enter password" style="margin:0;flex:3" autocapitalize="off"><button class="mini" id="genPw" style="flex:1">New</button></div>'+
     '<label class="lbl">Valid for</label><div class="chips" id="chips">'+[1,7,15,30,60,90].map(function(d){return '<button class="chip" data-d="'+d+'" aria-pressed="'+(d===validity)+'">'+d+' day'+(d>1?'s':'')+'</button>'}).join("")+'</div>'+
     '<label class="lbl" for="cdays">Or type days</label><input class="in s" id="cdays" type="number" min="1" max="3650" placeholder="e.g. 30" value="'+(validity||"")+'" inputmode="numeric">'+
     '<div class="err" id="ce"></div><button class="btn" id="mk">Create login</button>'+
     (lastCred?'<div class="cred" id="cred">'+esc(lastCred)+'</div><div class="row" style="margin-top:10px"><button class="btn sm ghost" id="cc">Copy all</button><button class="btn sm" id="ccl">Copy web link</button><button class="btn sm ghost" id="cco">Open link</button></div>':'')+'</div>';

  // clients
  h+='<div class="dash"><h2 class="card-h">Clients ('+db.clients.length+')</h2><p class="sub">Add days, disable, or remove access.</p>';
  if(!db.clients.length)h+='<div class="empty">No clients yet.</div>';
  db.clients.forEach(function(c){
    var st=status(c),sc=scriptById(c.scriptId);
    h+='<div class="item"><div class="nm">'+esc(c.id)+'<span class="badge '+(st==="live"?"ok":"bad")+'">'+(st==="live"?daysLeft(c)+" days left":st)+'</span></div>'+
       '<div class="meta">Password: <span data-pwv="'+c.id+'">••••••</span> · Visitors: '+(c.visitors||0)+'<br>Script: '+(sc?esc(sc.name):"none")+'<br>UPI: '+(c.upi?esc(c.upi):"not set")+'<br>Web link: <span style="word-break:break-all">'+(c.links[0]?esc(fullUrl(c.links[0])):"none")+'</span></div>'+
       '<div class="acts"><button class="mini" data-sh="'+c.id+'">Show password</button><button class="mini" data-ad="'+c.id+'">Add days</button><button class="mini" data-cl="'+c.id+'">Copy link</button><button class="mini" data-lk="'+c.id+'">Links</button><button class="mini" data-tg="'+c.id+'">'+(c.active?"Disable":"Enable")+'</button><button class="mini del" data-rm="'+c.id+'">Delete</button></div></div>';
  });
  h+='</div>';

  // domain + nav
  h+='<div class="dash"><h2 class="card-h">Client site address</h2><p class="sub">The address where client.html is hosted (example: client-2-dusky.vercel.app). Every client web link is built from it. Leave empty to use this page\'s own address.</p>'+
     '<input class="in s" id="dom" placeholder="client-2-dusky.vercel.app" value="'+esc(db.domain)+'" autocapitalize="off"><button class="btn sm" id="domSave">Save domain</button>'+
     '</div></div>';
  app.innerHTML=h;

  $("#lo").onclick=function(){ownerOK=false;renderOwner()};
  $("#pickFiles").onclick=function(){$("#files").click()};
  $("#files").onchange=function(e){
    var fl=[].slice.call(e.target.files),left=fl.length;if(!left)return;
    fl.forEach(function(f){var r=new FileReader();r.onload=function(){staged.push({fn:f.name,name:f.name.replace(/\.[^.]+$/,""),html:String(r.result)});if(--left===0)drawStaged()};r.onerror=function(){if(--left===0)drawStaged()};r.readAsText(f)});
    e.target.value="";
  };
  drawStaged();

  document.querySelectorAll("[data-pv]").forEach(function(b){b.onclick=function(){
    var s=scriptById(b.dataset.pv);
    var d=dlg('<h2 class="card-h">'+esc(s.name)+'</h2><iframe id="pvf" sandbox="allow-scripts" title="Preview"></iframe><div style="margin-top:12px"><button class="btn sm ghost" id="pvc">Close</button></div>');
    $("#pvf").srcdoc=s.html.split("{{UPI}}").join("demo@upi").split("{{TR}}").join("TR123");$("#pvc").onclick=closeDlg;
  }});
  document.querySelectorAll("[data-rn]").forEach(function(b){b.onclick=function(){
    var s=scriptById(b.dataset.rn);var d=dlg('<h2 class="card-h">Rename script</h2><input class="in deep s" id="rnv" value="'+esc(s.name)+'"><div class="row"><button class="btn sm" id="rns">Save</button><button class="btn sm ghost" id="rnc">Cancel</button></div>');
    $("#rnc").onclick=closeDlg;$("#rns").onclick=function(){var v=$("#rnv").value.trim();if(!v)return;s.name=v;save();closeDlg();renderOwner();toast("Renamed")};
  }});
  var repId=null;
  document.querySelectorAll("[data-rp]").forEach(function(b){b.onclick=function(){repId=b.dataset.rp;$("#repFile").click()}});
  $("#repFile").onchange=function(e){var f=e.target.files[0];if(!f||!repId)return;var r=new FileReader();r.onload=function(){scriptById(repId).html=String(r.result);save();renderOwner();toast("File replaced. Clients using it update at once.")};r.readAsText(f);e.target.value=""};
  document.querySelectorAll("[data-dl]").forEach(function(b){b.onclick=function(){
    var s=scriptById(b.dataset.dl);if(!confirm('Delete "'+s.name+'"? Clients using it will show "Coming soon".'))return;
    db.scripts=db.scripts.filter(function(x){return x.id!==s.id});db.clients.forEach(function(c){if(c.scriptId===s.id)c.scriptId=null});save();renderOwner();
  }});

  $("#genPw").onclick=function(){$("#cpw").value=rnd(8,"abcdefghjkmnpqrstuvwxyz23456789")};
  document.querySelectorAll("#chips .chip").forEach(function(b){b.onclick=function(){validity=+b.dataset.d;$("#cdays").value=validity;document.querySelectorAll("#chips .chip").forEach(function(x){x.setAttribute("aria-pressed",x===b)})}});
  $("#cdays").oninput=function(){validity=+this.value||0;document.querySelectorAll("#chips .chip").forEach(function(x){x.setAttribute("aria-pressed",+x.dataset.d===validity)})};
  $("#mk").onclick=function(){
    var id=$("#cid").value.trim(),pw=$("#cpw").value.trim(),days=Math.floor(+$("#cdays").value),e=$("#ce");
    if(id.length<3){e.textContent="User ID needs at least 3 characters";return}
    if(clientByLogin(id)){e.textContent="That User ID already exists";return}
    if(pw.length<6){e.textContent="Password needs at least 6 characters";return}
    if(!(days>=1)){e.textContent="Enter 1 or more days";return}
    var slug=cleanSlug(id);if(slugTaken(slug))slug=slug+rnd(3,"0123456789");
    db.clients.push({id:id,pass:pw,createdAt:Date.now(),expiresAt:Date.now()+days*86400000,active:true,upi:"",tr:"",scriptId:null,visitors:0,links:[slug]});
    lastSlug=slug;lastCred="User ID: "+id+"\nPassword: "+pw+"\nValid for: "+days+" day"+(days>1?"s":"")+"\nLogin page: "+siteBase()+"\nYour web link: "+fullUrl(slug);
    save();renderOwner();toast("Login created");
  };
  var cc=$("#cc");if(cc)cc.onclick=function(){copy(lastCred)};
  var ccl=$("#ccl");if(ccl)ccl.onclick=function(){copy(fullUrl(lastSlug))};
  var cco=$("#cco");if(cco)cco.onclick=function(){window.open(fullUrl(lastSlug),"_blank")};
  document.querySelectorAll("[data-cl]").forEach(function(b){b.onclick=function(){var c=clientByLogin(b.dataset.cl);if(c&&c.links[0])copy(fullUrl(c.links[0]))}});

  document.querySelectorAll("[data-sh]").forEach(function(b){b.onclick=function(){var c=clientByLogin(b.dataset.sh);var sp=document.querySelector('[data-pwv="'+c.id+'"]');sp.textContent=sp.textContent==="••••••"?c.pass:"••••••"}});
  document.querySelectorAll("[data-ad]").forEach(function(b){b.onclick=function(){
    var c=clientByLogin(b.dataset.ad);var d=dlg('<h2 class="card-h">Add days to '+esc(c.id)+'</h2><input class="in deep s" id="adv" type="number" min="1" value="30" inputmode="numeric"><div class="row"><button class="btn sm" id="ads">Add days</button><button class="btn sm ghost" id="adc">Cancel</button></div>');
    $("#adc").onclick=closeDlg;$("#ads").onclick=function(){var n=Math.floor(+$("#adv").value);if(!(n>=1))return;c.expiresAt=Math.max(c.expiresAt,Date.now())+n*86400000;save();closeDlg();renderOwner();toast("Added "+n+" days")};
  }});
  document.querySelectorAll("[data-lk]").forEach(function(b){b.onclick=function(){
    var c=clientByLogin(b.dataset.lk);var h2='<h2 class="card-h">Links for '+esc(c.id)+'</h2>';
    c.links.forEach(function(s){h2+='<div class="link-row"><div class="u">'+esc(fullUrl(s).replace(/^https?:\/\//,""))+'</div><button class="mini" data-c="'+s+'">Copy</button><button class="mini" data-o="'+s+'">Open</button></div>'});
    h2+='<div style="margin-top:12px"><button class="btn sm ghost" id="lkc">Close</button></div>';
    var d=dlg(h2);d.querySelectorAll("[data-c]").forEach(function(x){x.onclick=function(){copy(fullUrl(x.dataset.c))}});
    d.querySelectorAll("[data-o]").forEach(function(x){x.onclick=function(){closeDlg();window.open(fullUrl(x.dataset.o),"_blank")}});$("#lkc").onclick=closeDlg;
  }});
  document.querySelectorAll("[data-tg]").forEach(function(b){b.onclick=function(){var c=clientByLogin(b.dataset.tg);c.active=!c.active;save();renderOwner()}});
  document.querySelectorAll("[data-rm]").forEach(function(b){b.onclick=function(){if(!confirm("Delete this client and all their links?"))return;var dk=ck(b.dataset.rm);db.clients=db.clients.filter(function(c){return c.id!==b.dataset.rm});if(synced){rq("DELETE","/clients/"+dk);delete known[dk]}save();renderOwner()}});
  $("#domSave").onclick=function(){var v=$("#dom").value.trim().replace(/^https?:\/\//,"").replace(/\/.*$/,"");if(!v)return;db.domain=v;save();renderOwner();toast("Saved. New links use this address")};
}
function drawStaged(){
  var box=$("#stagedBox");if(!box)return;
  if(!staged.length){box.innerHTML="";return}
  var h="";staged.forEach(function(s,i){h+='<div class="staged"><small>'+esc(s.fn)+'</small><input class="in deep s" data-i="'+i+'" value="'+esc(s.name)+'" style="margin-bottom:0" placeholder="Script name"></div>'});
  h+='<div class="row"><button class="btn sm" id="stSave">Save '+staged.length+' to scripts</button><button class="btn sm ghost" id="stClear">Clear</button></div>';
  box.innerHTML=h;
  box.querySelectorAll("input[data-i]").forEach(function(i){i.oninput=function(){staged[+i.dataset.i].name=i.value}});
  $("#stClear").onclick=function(){staged=[];drawStaged()};
  $("#stSave").onclick=function(){
    var bad=staged.some(function(s){return !s.name.trim()});if(bad){toast("Give every file a name");return}
    staged.forEach(function(s){db.scripts.push({id:uid(),name:s.name.trim(),html:s.html,at:Date.now()})});
    var n=staged.length;staged=[];save();renderOwner();toast(n+" script"+(n>1?"s":"")+" saved");
  };
}


function boot(){
  var app=$("#app");
  if(needSetup()){app.innerHTML='<div class="wrap"><div class="dash"><h2 class="card-h">Setup needed</h2><p class="sub">Add your Firebase URL at the top of the script in owner.html.</p></div></div>';return}
  app.innerHTML='<div class="wrap"><div class="dash"><p class="sub">Loading...</p></div></div>';
  pull(function(nd,keys){
    if(!nd){app.innerHTML='<div class="wrap"><div class="dash"><h2 class="card-h">Cannot reach the server</h2><p class="sub">Check the Firebase URL and your connection.</p><button class="btn sm" id="rt">Try again</button></div></div>';$("#rt").onclick=boot;return}
    var local=load(),empty=!nd.owner&&!nd.clients.length&&!nd.scripts.length;
    if(empty&&local&&(local.owner||(local.clients&&local.clients.length)||(local.scripts&&local.scripts.length))){db=local;known={};synced=true;save()}
    else{db=nd;known={};keys.forEach(function(k){known[k]=1});synced=true;cache()}
    route();
  });
}
boot();
})();
</script>
</body>
</html>
